name: Assiny Scraper Automation

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Previne execuções travadas
    
    env:
      STORAGE_STATE_JSON: ${{ secrets.STORAGE_STATE_JSON }}
      GIT_USER_NAME: "github-actions"
      GIT_USER_EMAIL: "github-actions@github.com"
    
    steps:
      # 1️⃣ Checkout
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      # 2️⃣ Setup Python com cache
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      # 3️⃣ Cache Playwright browsers
      - name: Cache Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-v1
      
      # 4️⃣ Instalar dependências
      - name: Instalar dependências
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps
      
      # 5️⃣ Rodar scraper com tratamento de erro
      - name: Executar scraper
        id: scrape
        run: |
          python assiny_scraper.py 2>&1 | tee scraper.log
          echo "status=success" >> $GITHUB_OUTPUT
        continue-on-error: true
      
      # 6️⃣ Validar dados
      - name: Validar dados extraídos
        if: steps.scrape.outcome == 'success'
        run: |
          python -c "
          import json, sys
          try:
              with open('state/latest.json') as f:
                  data = json.load(f)
                  assert data.get('valor_liquido', 0) > 0
                  print(f'✅ Validação OK: R$ {data[\"valor_liquido\"]:,.2f}')
          except Exception as e:
              print(f'❌ Validação falhou: {e}')
              sys.exit(1)
          "
      
      # 7️⃣ Commit e push inteligente
      - name: Commit e push
        if: steps.scrape.outcome == 'success'
        run: |
          git config user.name "${GIT_USER_NAME}"
          git config user.email "${GIT_USER_EMAIL}"
          
          # Verifica mudanças
          if git diff --quiet HEAD -- valor_assiny.csv state/latest.json; then
            echo "✅ Sem mudanças nos dados"
            exit 0
          fi
          
          # Commit com retry
          for i in {1..3}; do
            git pull --rebase origin main || true
            git add valor_assiny.csv state/latest.json
            git commit -m "update: scraper $(date +'%Y-%m-%d %H:%M') [skip ci]" || true
            
            if git push origin main; then
              echo "✅ Push sucesso (tentativa $i)"
              exit 0
            fi
            sleep 5
          done
          
          echo "::warning::Falha no push após 3 tentativas"
      
      # 8️⃣ Resumo da execução
      - name: Gerar resumo
        if: always()
        run: |
          echo "### 📊 Execução do Scraper Assiny" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ steps.scrape.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "**Data:** $(date +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          
          if [ -f state/latest.json ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Dados extraídos:**" >> $GITHUB_STEP_SUMMARY
            echo '```
            cat state/latest.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ -f scraper.log ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "<details><summary>📋 Logs</summary>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```
            tail -50 scraper.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "</details>" >> $GITHUB_STEP_SUMMARY
          fi
